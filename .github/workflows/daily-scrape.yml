name: Daily HK Job Scrape

on:
  schedule:
    - cron: '0 1 * * *'  # 9:00 AM HKT (UTC+8)
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write   # keep-alive step below re-enables this workflow

    steps:
      # GitHub disables scheduled workflows after 60 days with no repo activity.
      # That silently froze the dashboard on 2026-05-29 (found 2026-10-06).
      # Re-enabling via the API on every run resets the inactivity timer
      # (same approach as the keepalive-workflow action's API mode).
      - name: Keep-alive (prevent 60-day auto-disable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-scrape.yml/enable"
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create data directory
        run: mkdir -p frontend/public/data

      - name: Run scraper (all categories, 5 sources)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python generate_data.py --force

      - name: Verify scraped data
        run: |
          echo "=== Scraped Data ==="
          ls -la frontend/public/data/
          echo "Total JSON files: $(ls frontend/public/data/*.json 2>/dev/null | wc -l)"

      # Hunter.io enrichment removed 2026-10-06: it spent up to 30 searches a day
      # on the free tier (50/month), the same budget the job search and the
      # Auramip pipeline depend on. Run hunter_enricher.py by hand if needed.

      - name: Build Astro frontend
        working-directory: ./frontend
        run: npm run build

      - name: Deploy Astro build via FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          expected=0
          ok=0
          failed=0
          while read -r f; do
            expected=$((expected + 1))
            remote_path="/hk-jobs/${f#./frontend/dist/}"
            if curl --ssl-reqd --insecure \
              --ftp-create-dirs \
              -T "$f" \
              "ftp://$FTP_HOST$remote_path" \
              --user "$FTP_USER:$FTP_PASS" \
              --connect-timeout 30 \
              --max-time 120 \
              --retry 2 \
              -s; then
              ok=$((ok + 1))
            else
              failed=$((failed + 1))
              echo "FAILED: $remote_path"
            fi
          done < <(find ./frontend/dist/ -type f)
          echo "Deploy: expected $expected, uploaded $ok, failed $failed"
          [ "$failed" -eq 0 ] || exit 1

      - name: Upload counter.php via FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          for f in ./frontend/public/*; do
            [ -d "$f" ] && continue
            fname=$(basename "$f")
            [[ "$fname" == ".htaccess" ]] && continue
            curl --ssl-reqd --insecure \
              -T "$f" \
              "ftp://$FTP_HOST/hk-jobs/$fname" \
              --user "$FTP_USER:$FTP_PASS" \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 2 \
              -s
            echo "Uploaded $fname"
          done
          echo "Done — public files deployed"
